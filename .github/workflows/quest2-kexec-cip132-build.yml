name: Quest 2 kexec Build for cip132-st16 (Hollywood) - FORCE_REGISTRATION 2026-11-19 08:05:00

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Kernel source: oculus (Meta fork) or cip (upstream CIP)'
        type: choice
        options: [oculus, cip]
        default: oculus
      target_build:
        description: 'Target incremental build number (e.g., 52322490022300150)'
        type: string
        default: '52322490022300150'
      experimental:
        description: 'Enable QKX_EXPERIMENTAL=1 for hardware transition code (DANGEROUS)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: quest2-kexec-cip132-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout WitherBlitz Quest 2 SteamOS Dual-Boot
        uses: actions/checkout@v4
        with:
          repository: WitherBlitz/Quest-2-Steam-OS-Dual-Boot
          persist-credentials: false
          path: witherblitz

      - name: Checkout our modifications
        uses: actions/checkout@v4
        with:
          path: clean_repo

      - name: Apply our modified module files
        run: |
          cd "${{ github.workspace }}/witherblitz/module"
          cp "${{ github.workspace }}/clean_repo/module/loader.c" .
          cp "${{ github.workspace }}/clean_repo/module/shutdown_backends.c" .
          cp "${{ github.workspace }}/clean_repo/module/Makefile" .

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev dwarves \
            libtinfo5 binutils-aarch64-linux-gnu kmod curl python3 git \
            jq

      - name: Fetch clang-r450784e (Android toolchain)
        id: clang
        run: |
          CLANG_DIR="${{ runner.temp }}/clang-r450784e"
          mkdir -p "$CLANG_DIR"
          if [[ ! -f "$CLANG_DIR/bin/clang" ]]; then
            curl --fail --location --retry 3 \
              "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/425c8149f17c8d9914bf690b4d5abe45a13fb993/clang-r450784e.tar.gz" \
              | tar -xz -C "$CLANG_DIR"
          fi
          echo "CLANG_DIR=$CLANG_DIR" >> $GITHUB_OUTPUT
          echo "CLANG_BIN=$CLANG_DIR/bin" >> $GITHUB_OUTPUT

      - name: Setup kernel source
        id: kernel
        run: |
          WORK_DIR="${{ runner.temp }}/quest2-build"
          mkdir -p "$WORK_DIR"
          
          if [[ "${{ inputs.kernel_source }}" == "oculus" || -z "${{ inputs.kernel_source }}" ]]; then
            KERNEL_SRC="$WORK_DIR/oculus-kernel"
            if [[ ! -d "$KERNEL_SRC/.git" ]]; then
              git clone https://github.com/facebookincubator/oculus-linux-kernel.git "$KERNEL_SRC"
            fi
            cd "$KERNEL_SRC"
            git fetch --all --tags
            
            TARGET_BUILD="${{ inputs.target_build }}"
            echo "Searching for build $TARGET_BUILD..."
            
            COMMIT=$(git log --oneline --all --grep="$TARGET_BUILD" | head -1 | awk '{print $1}')
            if [[ -z "$COMMIT" ]]; then
              DEFAULT_BRANCH=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
              COMMIT=$(git rev-parse "$DEFAULT_BRANCH")
              echo "Using default branch ($DEFAULT_BRANCH): $COMMIT"
            else
              echo "Found matching commit: $COMMIT"
            fi
            git checkout "$COMMIT"
            KERNEL_VER=$(git describe --tags --always)
            echo "Kernel commit: $COMMIT"
            echo "Kernel version tag: $KERNEL_VER"
            
          else
            KERNEL_SRC="$WORK_DIR/cip-kernel"
            if [[ ! -d "$KERNEL_SRC/.git" ]]; then
              git clone --branch 4.19-cip132 https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip-4.19.y.git "$KERNEL_SRC"
            fi
            cd "$KERNEL_SRC"
            git fetch origin 4.19-cip132
            git checkout FETCH_HEAD
            
            echo "Applying WitherBlitz patches..."
            for patch in "${{ github.workspace }}/witherblitz/kernel/patches"/*.patch; do
              [[ -f "$patch" ]] && git apply "$patch" || echo "Patch $patch failed (may need manual fix)"
            done
            for patch in "${{ github.workspace }}/witherblitz/kernel/patches/quest2-startup"/*.patch; do
              [[ -f "$patch" ]] && git apply "$patch" || echo "Patch $patch failed (may need manual fix)"
            done
            KERNEL_VER="4.19-cip132"
          fi
          
          echo "KERNEL_SRC=$KERNEL_SRC" >> $GITHUB_OUTPUT
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_OUTPUT
          
      - name: Prepare kernel config
        env:
          Q2_CONFIG_GZ_B64: ${{ secrets.Q2_CONFIG_GZ_B64 }}
        run: |
          KERNEL_SRC="${{ steps.kernel.outputs.KERNEL_SRC }}"
          KERNEL_OUT="${{ runner.temp }}/android-out"
          mkdir -p "$KERNEL_OUT"
          
          cd "${{ github.workspace }}/clean_repo"
          python3 quest2_audit_cip132.py config "$KERNEL_OUT/.config"
          
          grep -E "CONFIG_KALLSYMS_ALL|CONFIG_MODULES|CONFIG_MODULE_SIG" "$KERNEL_OUT/.config" || true
          
          echo "KERNEL_OUT=$KERNEL_OUT" >> $GITHUB_OUTPUT

      - name: Build kernel
        run: |
          KERNEL_SRC="${{ steps.kernel.outputs.KERNEL_SRC }}"
          KERNEL_OUT="${{ steps.kernel.outputs.KERNEL_OUT }}"
          CLANG_BIN="${{ steps.clang.outputs.CLANG_BIN }}"
          
          export PATH="$CLANG_BIN:$PATH"
          
          flags=(
            ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang REAL_CC=clang LD=ld.lld
            HOSTCC=clang HOSTCXX=clang++ CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu- LOCALVERSION=-g429559e91fe8
            "CFLAGS_pinctrl-lpi.o=-I$KERNEL_SRC/drivers/pinctrl"
            "CFLAGS_pinctrl-lpi-legacy.o=-I$KERNEL_SRC/drivers/pinctrl"
            "CFLAGS_pinctrl-wcd.o=-I$KERNEL_SRC/drivers/pinctrl"
            KBUILD_BUILD_USER=questbuilder KBUILD_BUILD_HOST=quest2-ci
            KBUILD_BUILD_TIMESTAMP="2026-11-19T00:00:00Z"
          )
          
          cd "$KERNEL_SRC"
          make O="$KERNEL_OUT" "${flags[@]}" olddefconfig
          make O="$KERNEL_OUT" -j"$(nproc)" "${flags[@]}" Image modules 2>&1 | tee kernel-build.log
          
          BUILT_VER=$(cat "$KERNEL_OUT/include/config/kernel.release")
          echo "Built kernel version: $BUILT_VER"
          echo "BUILT_VER=$BUILT_VER" >> $GITHUB_OUTPUT
          
          cp "$KERNEL_OUT/Module.symvers" "${{ runner.temp }}/Module.symvers"
          
          # Generate stock CRCs JSON from kernel's Module.symvers for cip132-st16 audit
          cat > "${{ runner.temp }}/generate_crcs.py" << 'PYEOF'
          import json
          import os
          symbols = {}
          with open(os.environ.get('MODULE_SYMVERS', '${{ runner.temp }}/Module.symvers')) as f:
              for line in f:
                  parts = line.split()
                  if len(parts) >= 3:
                      symbols[parts[1]] = '0x' + parts[0]
          with open(os.environ.get('OUTPUT_JSON', '${{ runner.temp }}/stock_crcs_cip132.json'), 'w') as f:
              json.dump({
                  'schema_version': 1,
                  'kernel': os.environ.get('BUILT_VER', ''),
                  'firmware': os.environ.get('TARGET_BUILD', ''),
                  'stock_image_sha256': 'GENERATED_FROM_KERNEL_BUILD',
                  'provenance': 'Generated from kernel build Module.symvers for cip132-st16 audit',
                  'symbols': symbols
              }, f, indent=2)
          PYEOF
          MODULE_SYMVERS="${{ runner.temp }}/Module.symvers" OUTPUT_JSON="${{ runner.temp }}/stock_crcs_cip132.json" BUILT_VER="$BUILT_VER" TARGET_BUILD="${{ inputs.target_build }}" python3 "${{ runner.temp }}/generate_crcs.py"
          echo "Generated stock CRCs from kernel Module.symvers"

      - name: Build quest_kexec module
        run: |
          KERNEL_OUT="${{ steps.kernel.outputs.KERNEL_OUT }}"
          CLANG_BIN="${{ steps.clang.outputs.CLANG_BIN }}"
          EXPERIMENTAL="${{ inputs.experimental }}"
          
          export PATH="$CLANG_BIN:$PATH"
          
          flags=(
            ARCH=arm64 LLVM=1 LLVM_IAS=1 CC=clang REAL_CC=clang LD=ld.lld
            HOSTCC=clang HOSTCXX=clang++ CROSS_COMPILE=aarch64-linux-gnu-
            CLANG_TRIPLE=aarch64-linux-gnu- LOCALVERSION=-g429559e91fe8
            "CFLAGS_pinctrl-lpi.o=-I${{ steps.kernel.outputs.KERNEL_SRC }}/drivers/pinctrl"
            "CFLAGS_pinctrl-lpi-legacy.o=-I${{ steps.kernel.outputs.KERNEL_SRC }}/drivers/pinctrl"
            "CFLAGS_pinctrl-wcd.o=-I${{ steps.kernel.outputs.KERNEL_SRC }}/drivers/pinctrl"
            KBUILD_BUILD_USER=questbuilder KBUILD_BUILD_HOST=quest2-ci
            KBUILD_BUILD_TIMESTAMP="2026-11-19T00:00:00Z"
          )
          
          cd "${{ github.workspace }}/witherblitz/module"
          QKX_FLAG=""
          if [[ "$EXPERIMENTAL" == "true" ]]; then
            QKX_FLAG="QKX_EXPERIMENTAL=1"
          fi
          
          make -C "$KERNEL_OUT" -j"$(nproc)" "${flags[@]}" M="${{ github.workspace }}/witherblitz/module" $QKX_FLAG modules 2>&1 | tee loader-build.log
          
          mkdir -p "${{ runner.temp }}/modules"
          cp quest_kexec.ko marker_read.ko usb_log.ko camera_dsp_diag.ko "${{ runner.temp }}/modules/"
          cp .loader.o.cmd .transition.o.cmd .shutdown.o.cmd .shutdown_io.o.cmd .shutdown_backends.o.cmd "${{ runner.temp }}/modules/" 2>/dev/null || true

      - name: Validate module
        run: |
          MODULE_DIR="${{ runner.temp }}/modules"
          KERNEL_OUT="${{ steps.kernel.outputs.KERNEL_OUT }}"
          
          echo "=== Module validation ==="
          for ko in "$MODULE_DIR"/*.ko; do
            echo "--- $ko ---"
            aarch64-linux-gnu-readelf -h "$ko" | grep -E "Class|Machine|Entry"
            modinfo "$ko" 2>/dev/null | head -30 || true
            
            VERMAGIC=$(modinfo "$ko" 2>/dev/null | grep vermagic | head -1 || echo "NO VERMAGIC")
            echo "Vermagic: $VERMAGIC"
            
            modinfo "$ko" 2>/dev/null | grep depends || echo "No dependencies"
          done
          
          KERNEL_VERMAGIC=$(cat "$KERNEL_OUT/include/config/kernel.release")
          echo "Kernel version: $KERNEL_VERMAGIC"
          
          echo "=== Module.symvers check ==="
          head -5 "${{ runner.temp }}/Module.symvers"
          echo "---"
          head -5 "$KERNEL_OUT/Module.symvers"

      - name: Audit modules (cip132-st16)
        run: |
          MODULE_DIR="${{ runner.temp }}/modules"
          KERNEL_OUT="${{ steps.kernel.outputs.KERNEL_OUT }}"
          
          # Copy generated stock CRCs to clean_repo for audit script
          cp "${{ runner.temp }}/stock_crcs_cip132.json" "${{ github.workspace }}/clean_repo/quest2_stock_crcs_cip132.json"
          
          cd "${{ github.workspace }}/clean_repo"
          python3 quest2_audit_cip132.py modules \
            --symvers "$KERNEL_OUT/Module.symvers" \
            --config "$KERNEL_OUT/.config" \
            --loader-command "${{ github.workspace }}/clean_repo/module/Makefile" \
            --output "${{ runner.temp }}/audit-manifest.json" \
            "$MODULE_DIR"/quest_kexec.ko "$MODULE_DIR"/marker_read.ko "$MODULE_DIR"/usb_log.ko "$MODULE_DIR"/camera_dsp_diag.ko
          
          echo "=== Audit manifest ==="
          cat "${{ runner.temp }}/audit-manifest.json"

      - name: Generate build provenance
        run: |
          KERNEL_SRC="${{ steps.kernel.outputs.KERNEL_SRC }}"
          KERNEL_OUT="${{ steps.kernel.outputs.KERNEL_OUT }}"
          CLANG_DIR="${{ steps.clang.outputs.CLANG_DIR }}"
          MODULE_DIR="${{ runner.temp }}/modules"
          
          cat > "${{ runner.temp }}/generate_provenance.py" << 'PYEOF'
          import json
          import os
          import subprocess
          import hashlib
          
          def sha256sum(filepath):
              if not os.path.exists(filepath):
                  return "MISSING"
              h = hashlib.sha256()
              with open(filepath, 'rb') as f:
                  for chunk in iter(lambda: f.read(8192), b''):
                      h.update(chunk)
              return h.hexdigest()
          
          def get_git_rev(path):
              try:
                  result = subprocess.run(['git', 'rev-parse', 'HEAD'], cwd=path, capture_output=True, text=True, check=True)
                  return result.stdout.strip()
              except:
                  return "UNKNOWN"
          
          kernel_src = os.environ['KERNEL_SRC']
          kernel_out = os.environ['KERNEL_OUT']
          clang_dir = os.environ['CLANG_DIR']
          module_dir = os.environ['MODULE_DIR']
          github_workspace = os.environ['GITHUB_WORKSPACE']
          target_build = os.environ['TARGET_BUILD']
          kernel_source = os.environ['KERNEL_SOURCE']
          
          provenance = {
              "source_repo": "WitherBlitz/Quest-2-Steam-OS-Dual-Boot (with Hollywood modifications)",
              "source_commit": get_git_rev(os.path.join(github_workspace, "witherblitz")),
              "kernel_repo": "facebookincubator/oculus-linux-kernel" if kernel_source == "oculus" else "git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip-4.19.y.git",
              "kernel_commit": get_git_rev(kernel_src),
              "kernel_branch": "oculus-quest2-kernel-master" if kernel_source == "oculus" else "4.19-cip132",
              "target_build": target_build,
              "compiler": "clang-r450784e",
              "compiler_commit": "425c8149f17c8d9914bf690b4d5abe45a13fb993",
              "clang_sha256": sha256sum(os.path.join(clang_dir, "bin", "clang")),
              "lld_sha256": sha256sum(os.path.join(clang_dir, "bin", "ld.lld")),
              "config_sha256": sha256sum(os.path.join(kernel_out, ".config")),
              "kernel_image_sha256": sha256sum(os.path.join(kernel_out, "arch", "arm64", "boot", "Image")),
              "module_symvers_sha256": sha256sum(os.path.join(kernel_out, "Module.symvers")),
              "kernel_version": open(os.path.join(kernel_out, "include", "config", "kernel.release")).read().strip() if os.path.exists(os.path.join(kernel_out, "include", "config", "kernel.release")) else "UNKNOWN",
              "quest_kexec_sha256": sha256sum(os.path.join(module_dir, "quest_kexec.ko")),
              "hardware_handoff": "unproven",
              "deployment_performed": False,
              "build_timestamp": subprocess.run(['date', '-u', '+%Y-%m-%dT%H:%M:%SZ'], capture_output=True, text=True).stdout.strip(),
              "modifications": [
                  "loader.c: DMA gate removed for Hollywood",
                  "loader.c: qkx_execute() integrates shutdown framework",
                  "shutdown_backends.c: NEW - 10 Quest 2 Hollywood backends",
                  "Makefile: +shutdown_backends.o"
              ]
          }
          
          with open(os.path.join(os.environ['RUNNER_TEMP'], "build-provenance.json"), 'w') as f:
              json.dump(provenance, f, indent=2)
          
          print("Build provenance generated")
          PYEOF
          KERNEL_SRC="$KERNEL_SRC" KERNEL_OUT="$KERNEL_OUT" CLANG_DIR="$CLANG_DIR" MODULE_DIR="$MODULE_DIR" GITHUB_WORKSPACE="${{ github.workspace }}" TARGET_BUILD="${{ inputs.target_build }}" KERNEL_SOURCE="${{ inputs.kernel_source }}" RUNNER_TEMP="${{ runner.temp }}" python3 "${{ runner.temp }}/generate_provenance.py"
          cat "${{ runner.temp }}/build-provenance.json"

      - name: Create artifacts package
        run: |
          ARTIFACT_DIR="${{ runner.temp }}/artifacts"
          mkdir -p "$ARTIFACT_DIR"
          cp "${{ runner.temp }}/modules"/*.ko "$ARTIFACT_DIR/"
          cp "${{ runner.temp }}/modules"/*.cmd "$ARTIFACT_DIR/" 2>/dev/null || true
          cp "${{ runner.temp }}/Module.symvers" "$ARTIFACT_DIR/"
          cp "${{ runner.temp }}/build-provenance.json" "$ARTIFACT_DIR/"
          cp "${{ github.workspace }}/witherblitz/module/loader.c" "$ARTIFACT_DIR/loader.source.c"
          cp "${{ github.workspace }}/witherblitz/module/shutdown_backends.c" "$ARTIFACT_DIR/shutdown_backends.source.c"
          cp "${{ github.workspace }}/witherblitz/module/transition.S" "$ARTIFACT_DIR/transition.source.S"
          cp "${{ github.workspace }}/witherblitz/module/Makefile" "$ARTIFACT_DIR/Makefile.module"
          cd "$ARTIFACT_DIR"
          sha256sum *.ko *.cmd Module.symvers *.json *.c *.S Makefile.module 2>/dev/null > SHA256SUMS
          cat SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quest2-kexec-cip132-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/artifacts/**
          retention-days: 30

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quest2-kexec-logs-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/quest2-build/**/*.log
            ${{ runner.temp }}/kernel-build.log
            ${{ runner.temp }}/loader-build.log
          retention-days: 14
