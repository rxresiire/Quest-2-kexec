name: Quest 2 kexec Build for cip132-st16 (Hollywood)

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Kernel source: oculus (Meta fork) or cip (upstream CIP)'
        type: choice
        options: [oculus, cip]
        default: oculus
      target_build:
        description: 'Target incremental build number (e.g., 52322490022300150)'
        type: string
        default: '52322490022300150'
      module_source:
        description: 'Module sources: witherblitz (staging-only) or q2fork (Quest 2 port, jump enabled)'
        type: choice
        options: [witherblitz, q2fork]
        default: q2fork
      experimental:
        description: 'Enable QKX_EXPERIMENTAL=1 for hardware transition code (DANGEROUS)'
        type: boolean
        default: true

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: quest2-kexec-cip132-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BUILD: ${{ inputs.target_build || '52322490022300150' }}
  KERNEL_SOURCE: ${{ inputs.kernel_source || 'oculus' }}
  MODULE_SOURCE: ${{ inputs.module_source || 'q2fork' }}
  EXPERIMENTAL: ${{ inputs.experimental || true }}

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Export build toolchain
        run: |
          echo "KERNEL_OUT=$RUNNER_TEMP/android-out" >> "$GITHUB_ENV"
          echo "MODULE_DIR=$RUNNER_TEMP/modules" >> "$GITHUB_ENV"
          echo "WORK_DIR=$RUNNER_TEMP/quest2-build" >> "$GITHUB_ENV"
          echo "KERNEL_LOCALVERSION=-g429559e91fe8" >> "$GITHUB_ENV"
          # Command-line assignments, not environment: this 4.19 tree sets
          # CC = $(CROSS_COMPILE)gcc inside the Makefile, which wins over the
          # environment. Kconfig probes (CC_IS_CLANG, CLANG_VERSION, CC_HAS_*,
          # FORTIFY_SOURCE defaults) must come from the clang/LLD pair that also
          # compiles the module, so every stage expands the same array.
          echo "KBUILD_FLAGS=ARCH=arm64 CC=clang LD=ld.lld HOSTCC=clang HOSTCXX=clang++ CROSS_COMPILE=aarch64-linux-gnu- CLANG_TRIPLE=aarch64-linux-gnu-" >> "$GITHUB_ENV"

      # Kernel patching material always comes from the WitherBlitz tree; the
      # module sources are checked out separately because they are selectable.
      - name: Checkout WitherBlitz kernel patches
        uses: actions/checkout@v4
        with:
          repository: WitherBlitz/Quest-2-Steam-OS-Dual-Boot
          persist-credentials: false
          path: witherblitz

      - name: Checkout module sources
        uses: actions/checkout@v4
        with:
          repository: ${{ env.MODULE_SOURCE == 'q2fork' && 'machachu56/quest-kexec-q2' || 'WitherBlitz/Quest-2-Steam-OS-Dual-Boot' }}
          persist-credentials: false
          path: modulesrc

      - name: Checkout our modifications
        uses: actions/checkout@v4
        with:
          path: clean_repo

      # witherblitz ships the upstream staging-only module; q2fork is the Quest 2
      # port of the same loader. It compiles the jump path unconditionally and has
      # no Hollywood DMA gate, which the audit records as an experimental artifact.
      - name: Verify module sources
        run: |
          cd "${{ github.workspace }}/modulesrc/module"
          test -f loader.c && test -f transition.S && test -f Makefile
          if [[ "${{ env.MODULE_SOURCE }}" == "q2fork" ]]; then
            grep -q 'quest_kexec-y := loader.o transition.o' Makefile
            echo "Module sources are the quest-kexec-q2 Quest 2 port."
          else
            test -f shutdown.c && test -f shutdown_io.c
            grep -q 'quest_kexec-y := loader.o transition.o shutdown.o shutdown_io.o' Makefile
            echo "Module sources are the upstream staging-only build."
          fi
          if grep -rq 'shutdown_backends' .; then
            echo "::error::stale loader fork detected in module sources"
            exit 1
          fi

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev dwarves \
            libtinfo5 binutils-aarch64-linux-gnu kmod curl python3 git \
            jq cpio

      - name: Restore clang-r450784e toolchain
        id: clangcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/clang-r450784e
          key: clang-r450784e-425c8149f17c8d9914bf690b4d5abe45a13fb993


      - name: Fetch clang-r450784e (Android toolchain)
        id: clang
        run: |
          CLANG_DIR="${{ runner.temp }}/clang-r450784e"
          ARCHIVE="${{ runner.temp }}/clang-r450784e.tar.gz"
          URL="https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/425c8149f17c8d9914bf690b4d5abe45a13fb993/clang-r450784e.tar.gz"
          if [[ ! -x "$CLANG_DIR/bin/clang" ]]; then
            for attempt in 1 2 3 4 5; do
              echo "Toolchain download attempt $attempt"
              rm -rf "$CLANG_DIR" "$ARCHIVE"
              mkdir -p "$CLANG_DIR"
              curl --fail --location --retry 5 --retry-all-errors --retry-delay 5 \
                   --connect-timeout 30 --max-time 900 -o "$ARCHIVE" "$URL" || true
              if tar -tzf "$ARCHIVE" > /dev/null 2>&1; then
                tar -xzf "$ARCHIVE" -C "$CLANG_DIR"
                break
              fi
              echo "::warning::toolchain archive is incomplete or corrupt; retrying"
            done
            rm -f "$ARCHIVE"
          fi
          if [[ ! -x "$CLANG_DIR/bin/clang" ]]; then
            echo "::error::clang-r450784e could not be materialised"
            exit 1
          fi
          "$CLANG_DIR/bin/clang" --version | head -1
          echo "CLANG_DIR=$CLANG_DIR" >> "$GITHUB_OUTPUT"
          echo "CLANG_BIN=$CLANG_DIR/bin" >> "$GITHUB_OUTPUT"

      - name: Save clang-r450784e toolchain
        if: always() && steps.clangcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/clang-r450784e
          key: clang-r450784e-425c8149f17c8d9914bf690b4d5abe45a13fb993
      - name: Setup kernel source
        id: kernel
        run: |
          mkdir -p "$WORK_DIR"

          if [[ "$KERNEL_SOURCE" == "oculus" ]]; then
            # This vendor tree is an AOSP-style partial checkout: headers such as
            # techpack/audio/soc/core.h are symlinks that climb six directories
            # and re-enter at kernel/qcom/kona/. The clone therefore has to live
            # at <root>/kernel/qcom/kona, otherwise those links dangle and the
            # build dies on "core.h file not found".
            KERNEL_SRC="$WORK_DIR/android/kernel/qcom/kona"
            mkdir -p "$(dirname "$KERNEL_SRC")"
            if [[ ! -d "$KERNEL_SRC/.git" ]]; then
              git clone --depth 100 --branch oculus-quest2-kernel-master \
                https://github.com/facebookincubator/oculus-linux-kernel.git "$KERNEL_SRC"
            fi
            # Build the exact tree the headset runs. Commit 9c58c012f35d is
            # "Oculus Quest 2 kernel project build: 5232249.2230.150", which is
            # firmware 52322490022300150 - the build id reported by the device.
            # Building branch head instead drifts genksyms CRCs for symbols such as
            # filp_open/__free_pages and the kernel then rejects the module.
            git -C "$KERNEL_SRC" fetch --depth 100 origin 9c58c012f35d 2>/dev/null || true
            git -C "$KERNEL_SRC" checkout --detach 9c58c012f35d
            cd "$KERNEL_SRC"
            # Refuse to spend an hour compiling a tree whose vendor headers are
            # already broken: every dangling symlink is listed before the build.
            dangling=$(find techpack -xtype l 2>/dev/null | head -40 || true)
            if [[ -n "$dangling" ]]; then
              echo "::error::Dangling vendor symlinks after checkout:"
              echo "$dangling"
              echo "Kernel source must live at <root>/kernel/qcom/kona so ../../../../../../ re-enters it."
              exit 1
            fi
            echo "Vendor header symlinks resolve out of $(pwd)."
            DEFCONFIG=vendor/oculus_kona_defconfig
          else
            KERNEL_SRC="$WORK_DIR/cip-kernel"
            if [[ ! -d "$KERNEL_SRC/.git" ]]; then
              git clone --depth 1 --branch 4.19-cip132 \
                https://git.kernel.org/pub/scm/linux/kernel/git/cip/linux-cip-4.19.y.git "$KERNEL_SRC"
            fi
            cd "$KERNEL_SRC"
            for patch in "${{ github.workspace }}/witherblitz/kernel/patches"/*.patch; do
              [[ -f "$patch" ]] && git apply "$patch" || echo "Patch $patch skipped"
            done
            for patch in "${{ github.workspace }}/witherblitz/kernel/patches/quest2-startup"/*.patch; do
              [[ -f "$patch" ]] && git apply "$patch" || echo "Patch $patch skipped"
            done
            DEFCONFIG=vendor/oculus_kona_defconfig
          fi

          echo "KERNEL_HEAD=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "KERNEL_SRC=$KERNEL_SRC" >> "$GITHUB_OUTPUT"
          echo "DEFCONFIG=$DEFCONFIG" >> "$GITHUB_OUTPUT"
          echo "FRAGMENT=arch/arm64/configs/vendor/oculus_hollywood_defconfig" >> "$GITHUB_OUTPUT"
          echo "Kernel source: $KERNEL_SRC"
          echo "Defconfig: $DEFCONFIG"

      - name: Prepare and validate kernel config
        id: config
        env:
          Q2_CONFIG_GZ_B64: ${{ secrets.Q2_CONFIG_GZ_B64 }}
        run: |
          KERNEL_SRC="${{ steps.kernel.outputs.KERNEL_SRC }}"
          DEFCONFIG="${{ steps.kernel.outputs.DEFCONFIG }}"
          FRAGMENT="${{ steps.kernel.outputs.FRAGMENT }}"
          mkdir -p "$KERNEL_OUT" "${{ github.workspace }}/config"
          export PATH="${{ steps.clang.outputs.CLANG_BIN }}:$PATH"

          cd "${{ github.workspace }}/clean_repo"
          PREPARED="${{ github.workspace }}/config/prepared.config"
          SOURCE=unknown
          read -r -a kflags <<< "$KBUILD_FLAGS"

          echo "Kconfig toolchain: $(command -v clang) -> $(clang --version | head -1)"
          echo "Linker: $(command -v ld.lld) -> $(ld.lld --version | head -1)"

          set +e
          python3 quest2_audit_cip132.py config "$PREPARED"
          STATUS=$?
          set -e

          if [[ $STATUS -eq 0 ]]; then
            SOURCE=device-secret
            echo "Kernel config came from the device secret and matched the pinned digest."
            cp "$PREPARED" "$KERNEL_OUT/.config"
          elif [[ -f "${{ github.workspace }}/config/q2-stock.config" ]]; then
            # The headset's own /proc/config.gz (firmware 52322490022300150) is the
            # authoritative configuration: struct layout probes such as
            # module_layout's CRC follow from it, so this is what the module must be
            # built against. It is committed as config/q2-stock.config.
            echo "Using the device's own /proc/config.gz (config/q2-stock.config)."
            cp "${{ github.workspace }}/config/q2-stock.config" "$KERNEL_OUT/.config"
            # LOCALVERSION_AUTO would append this clone's commit hash on top of the
            # device's own -g suffix; disabling it keeps vermagic byte-identical to
            # the headset. It affects only the version string, never struct layout,
            # so no CRC moves.
            "$KERNEL_SRC/scripts/config" --file "$KERNEL_OUT/.config" --disable LOCALVERSION_AUTO
            cd "$KERNEL_SRC"
            make O="$KERNEL_OUT" "${kflags[@]}" LOCALVERSION="$KERNEL_LOCALVERSION" olddefconfig
            cp "$KERNEL_OUT/.config" "$PREPARED"
            SOURCE=device-config
            cd "${{ github.workspace }}/clean_repo"
            python3 quest2_audit_cip132.py config "$PREPARED" --from-file "$PREPARED"
          elif [[ $STATUS -eq 3 ]]; then
            echo "::warning::Q2_CONFIG_GZ_B64 is unusable, deriving the config from $DEFCONFIG + $FRAGMENT with the build toolchain."
            cd "$KERNEL_SRC"
            make O="$KERNEL_OUT" "${kflags[@]}" "$DEFCONFIG"
            cat "$KERNEL_SRC/$FRAGMENT" >> "$KERNEL_OUT/.config"
            "$KERNEL_SRC/scripts/config" --file "$KERNEL_OUT/.config" --disable LOCALVERSION_AUTO
            make O="$KERNEL_OUT" "${kflags[@]}" LOCALVERSION="$KERNEL_LOCALVERSION" olddefconfig
            cp "$KERNEL_OUT/.config" "$PREPARED"
            SOURCE=source-defconfig
            cd "${{ github.workspace }}/clean_repo"
            python3 quest2_audit_cip132.py config "$PREPARED" --from-file "$PREPARED"
          else
            echo "::error::Config gate rejected the supplied secret; refusing to substitute silently."
            exit 1
          fi

          # Determinism gate: regenerating with the same toolchain must not change
          # a single byte. Any diff here is a real finding, never silenced.
          cd "$KERNEL_SRC"
          cp "$PREPARED" "$KERNEL_OUT/.config"
          make O="$KERNEL_OUT" "${kflags[@]}" LOCALVERSION="$KERNEL_LOCALVERSION" olddefconfig > /dev/null
          if ! cmp -s "$PREPARED" "$KERNEL_OUT/.config"; then
            echo "::error::olddefconfig is not idempotent under the build toolchain."
            diff -u "$PREPARED" "$KERNEL_OUT/.config" | tee "${{ runner.temp }}/config-diff.patch" || true
            echo "Differing options:"
            diff <(grep -E '^(# )?CONFIG_' "$PREPARED" | sort) \
                 <(grep -E '^(# )?CONFIG_' "$KERNEL_OUT/.config" | sort) | sed -E 's/^/  /' || true
            exit 1
          fi
          echo "olddefconfig is idempotent under clang; the prepared config is the audited config."

          # The recorded CLANG_VERSION must describe the compiler that will build
          # the modules, otherwise the capability probes in the config are stale.
          CLANG_TRIPLE_VERSION=$(clang --version | head -1 | sed -E 's/.*version ([0-9]+)\.([0-9]+)\.([0-9]+).*/\1 \2 \3/')
          read -r MAJOR MINOR PATCH <<< "$CLANG_TRIPLE_VERSION"
          EXPECTED_CLANG_VERSION=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          CONFIG_CLANG_VERSION=$(grep -E '^CONFIG_CLANG_VERSION=' "$PREPARED" | cut -d= -f2)
          if [[ "$CONFIG_CLANG_VERSION" != "$EXPECTED_CLANG_VERSION" ]]; then
            echo "::error::CONFIG_CLANG_VERSION=$CONFIG_CLANG_VERSION does not match clang $MAJOR.$MINOR.$PATCH ($EXPECTED_CLANG_VERSION)"
            exit 1
          fi
          echo "CONFIG_CLANG_VERSION=$CONFIG_CLANG_VERSION matches the build compiler."

          grep -E "CONFIG_CC_IS_CLANG|CONFIG_FORTIFY_SOURCE|CONFIG_KASAN|CONFIG_SHADOW_CALL_STACK|CONFIG_CFI_CLANG|CONFIG_LTO|CONFIG_KEXEC|CONFIG_MODULES=|CONFIG_MODVERSIONS|CONFIG_KALLSYMS_ALL" "$PREPARED"

          CONFIG_SHA=$(sha256sum "$PREPARED" | cut -d' ' -f1)
          echo "CONFIG_SHA=$CONFIG_SHA" >> "$GITHUB_OUTPUT"
          echo "CONFIG_SOURCE=$SOURCE" >> "$GITHUB_OUTPUT"

      - name: Restore kernel build output
        id: kernelcache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/android-out
          key: kout-${{ steps.kernel.outputs.KERNEL_HEAD }}-${{ steps.config.outputs.CONFIG_SHA }}-llvm-r450784e

      - name: Build kernel
        id: build
        run: |
          KERNEL_SRC="${{ steps.kernel.outputs.KERNEL_SRC }}"
          export PATH="${{ steps.clang.outputs.CLANG_BIN }}:$PATH"

          read -r -a kflags <<< "$KBUILD_FLAGS"
          build_flags=("${kflags[@]}" LOCALVERSION="$KERNEL_LOCALVERSION"
            KBUILD_BUILD_USER=questbuilder KBUILD_BUILD_HOST=quest2-ci
            KBUILD_BUILD_TIMESTAMP=2026-11-19T00:00:00Z)

          cd "$KERNEL_SRC"
          cp "${{ github.workspace }}/config/prepared.config" "$KERNEL_OUT/.config"
          make O="$KERNEL_OUT" "${build_flags[@]}" olddefconfig

          if ! cmp -s "${{ github.workspace }}/config/prepared.config" "$KERNEL_OUT/.config"; then
            echo "::error::olddefconfig rewrote the audited config; the configuration does not match the build toolchain."
            diff -u "${{ github.workspace }}/config/prepared.config" "$KERNEL_OUT/.config" | head -200 || true
            exit 1
          fi
          echo "Audited config accepted unchanged by olddefconfig."

          if [[ -s "$KERNEL_OUT/Module.symvers" && -s "$KERNEL_OUT/arch/arm64/boot/Image" ]]; then
            echo "Reusing cached kernel output: $(cat "$KERNEL_OUT/include/config/kernel.release")"
            echo "::notice::Kernel objects restored from cache; no recompile needed."
          else
            make O="$KERNEL_OUT" -j"$(nproc)" "${build_flags[@]}" Image modules 2>&1 | tee "${{ runner.temp }}/kernel-build.log"
          fi

          BUILT_VER=$(cat "$KERNEL_OUT/include/config/kernel.release")
          echo "Built kernel version: $BUILT_VER"
          echo "BUILT_VER=$BUILT_VER" >> "$GITHUB_OUTPUT"

          cp "$KERNEL_OUT/Module.symvers" "${{ runner.temp }}/Module.symvers"

          cat > "${{ runner.temp }}/generate_crcs.py" << 'PYEOF'
          import json
          import os

          symbols = {}
          with open(os.environ['MODULE_SYMVERS']) as handle:
              for line in handle:
                  parts = line.split()
                  if len(parts) >= 3:
                      crc = parts[0]
                      symbols[parts[1]] = crc if crc.startswith('0x') else '0x' + crc
          with open(os.environ['OUTPUT_JSON'], 'w') as handle:
              json.dump({
                  'schema_version': 1,
                  'kernel': os.environ.get('BUILT_VER', ''),
                  'firmware': os.environ.get('TARGET_BUILD', ''),
                  'provenance': 'Derived from this build\'s Module.symvers: proves module/ABI self-consistency only, NOT device stock CRCs',
                  'symbols': symbols
              }, handle, indent=2)
          PYEOF
          MODULE_SYMVERS="${{ runner.temp }}/Module.symvers" \
          OUTPUT_JSON="${{ runner.temp }}/stock_crcs_cip132.json" \
          BUILT_VER="$BUILT_VER" TARGET_BUILD="$TARGET_BUILD" \
            python3 "${{ runner.temp }}/generate_crcs.py"

      - name: Save kernel build output
        if: always() && steps.kernelcache.outputs.cache-hit != 'true' && steps.build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/android-out
          key: kout-${{ steps.kernel.outputs.KERNEL_HEAD }}-${{ steps.config.outputs.CONFIG_SHA }}-llvm-r450784e

      - name: Build quest_kexec module
        run: |
          export PATH="${{ steps.clang.outputs.CLANG_BIN }}:$PATH"
          mkdir -p "$MODULE_DIR"

          cd "${{ github.workspace }}/modulesrc/module"
          # q2fork jumps to the Image header (offset 0) instead of text_offset.
          # The Quest 2 cip132 Image header has text_offset=0x80000, meaning kernel
          # code starts 512KB into the file. Jumping to QKX_ENTRY (offset 0 =
          # header data) causes an immediate kernel panic. Fix: read text_offset
          # from the Image header and jump to QKX_ENTRY + text_offset instead.
          if [[ "${{ env.MODULE_SOURCE }}" == "q2fork" ]]; then
            cp "${{ github.workspace }}/config/loader-q2fork-fixed.c" loader.c
          fi
          QKX_FLAG=""
          # q2fork's Makefile enables the jump unconditionally; the witheblitz
          # sources need the explicit flag. Both record it in the provenance.
          if [[ "${{ env.EXPERIMENTAL }}" == "true" || "${{ env.MODULE_SOURCE }}" == "q2fork" ]]; then
            QKX_FLAG="QKX_EXPERIMENTAL=1"
            echo "QKX_EXPERIMENTAL=1" >> "$GITHUB_ENV"
          fi

          read -r -a kflags <<< "$KBUILD_FLAGS"
          make -C "$KERNEL_OUT" -j"$(nproc)" \
            "${kflags[@]}" LOCALVERSION="$KERNEL_LOCALVERSION" \
            KBUILD_BUILD_USER=questbuilder KBUILD_BUILD_HOST=quest2-ci \
            KBUILD_BUILD_TIMESTAMP=2026-11-19T00:00:00Z \
            M="${{ github.workspace }}/modulesrc/module" $QKX_FLAG modules \
            2>&1 | tee "${{ runner.temp }}/loader-build.log"

          cp *.ko "$MODULE_DIR/"
          # .loader.o.cmd is a dotfile, so a shell glob would miss it.
          find . -maxdepth 1 -name '*.cmd' -exec cp {} "$MODULE_DIR/" \;

      - name: Align module_layout to the device
        run: |
          cd "${{ github.workspace }}/clean_repo"
          # Meta's internal tree carries vendor patches, so some genksyms CRCs cannot
          # be reproduced from the public branch. Every symbol whose true CRC the
          # headset's own stock modules publish is rewritten to that value, and each
          # rewrite is printed and audited; nothing is aligned silently.
          for ko in "$MODULE_DIR"/*.ko; do
            python3 quest2_audit_cip132.py align "$ko" --all-from config/q2-device-crcs.json
          done

      - name: Validate module
        run: |
          for ko in "$MODULE_DIR"/*.ko; do
            echo "--- $ko ---"
            aarch64-linux-gnu-readelf -h "$ko" | grep -E "Class|Machine|Type"
            modinfo "$ko" 2>/dev/null | grep -E "vermagic|depends" || true
          done

      - name: Audit modules (cip132-st16)
        run: |
          cd "${{ github.workspace }}/clean_repo"
          AUDIT_FLAGS=""
          if [[ "${{ env.EXPERIMENTAL }}" == "true" || "${{ env.MODULE_SOURCE }}" == "q2fork" ]]; then
            AUDIT_FLAGS="--allow-experimental-jump"
          fi
          python3 quest2_audit_cip132.py modules \
            --symvers "$KERNEL_OUT/Module.symvers" \
            --config "$KERNEL_OUT/.config" \
            --config-sha "${{ steps.config.outputs.CONFIG_SHA }}" \
            --stock-crcs config/q2-device-crcs.json \
            --loader-command "$MODULE_DIR/.loader.o.cmd" \
            $AUDIT_FLAGS \
            --output "${{ runner.temp }}/audit-manifest.json" \
            "$MODULE_DIR"/*.ko
          cat "${{ runner.temp }}/audit-manifest.json"

      - name: Generate build provenance
        run: |
          cat > "${{ runner.temp }}/generate_provenance.py" << 'PYEOF'
          import hashlib
          import json
          import os
          import subprocess

          def sha256sum(path):
              if not os.path.exists(path):
                  return "MISSING"
              digest = hashlib.sha256()
              with open(path, 'rb') as handle:
                  for chunk in iter(lambda: handle.read(8192), b''):
                      digest.update(chunk)
              return digest.hexdigest()

          def git_rev(path):
              try:
                  return subprocess.run(['git', 'rev-parse', 'HEAD'], cwd=path,
                                        capture_output=True, text=True, check=True).stdout.strip()
              except Exception:
                  return "UNKNOWN"

          def read_text(path):
              try:
                  with open(path) as handle:
                      return handle.read().strip()
              except OSError:
                  return "UNKNOWN"

          kernel_out = os.environ['KERNEL_OUT']
          provenance = {
              "source_repo": os.environ['MODULE_SOURCE_REPO'],
              "source_commit": git_rev(os.path.join(os.environ['GITHUB_WORKSPACE'], "modulesrc")),
              "kernel_repo": os.environ['KERNEL_SOURCE'],
              "kernel_commit": git_rev(os.environ['KERNEL_SRC']),
              "target_build": os.environ['TARGET_BUILD'],
              "config_source": os.environ['CONFIG_SOURCE'],
              "config_sha256": sha256sum(os.path.join(kernel_out, ".config")),
              "kernel_release": read_text(os.path.join(kernel_out, "include", "config", "kernel.release")),
              "kernel_image_sha256": sha256sum(os.path.join(kernel_out, "arch", "arm64", "boot", "Image")),
              "module_symvers_sha256": sha256sum(os.path.join(kernel_out, "Module.symvers")),
              "quest_kexec_sha256": sha256sum(os.path.join(os.environ['MODULE_DIR'], "quest_kexec.ko")),
              "experimental_jump": os.environ.get('QKX_EXPERIMENTAL') == '1',
              "stage_only": os.environ.get('QKX_EXPERIMENTAL') != '1',
              "hardware_handoff": "experimental" if os.environ.get('QKX_EXPERIMENTAL') == '1' else "unproven",
              "deployment_performed": False,
          }
          with open(os.path.join(os.environ['RUNNER_TEMP'], "build-provenance.json"), 'w') as handle:
              json.dump(provenance, handle, indent=2)
          PYEOF
          KERNEL_OUT="$KERNEL_OUT" KERNEL_SRC="${{ steps.kernel.outputs.KERNEL_SRC }}" \
          KERNEL_SOURCE="$KERNEL_SOURCE" TARGET_BUILD="$TARGET_BUILD" \
          CONFIG_SOURCE="${{ steps.config.outputs.CONFIG_SOURCE }}" \
          QKX_EXPERIMENTAL="$QKX_EXPERIMENTAL" \
          MODULE_SOURCE_REPO="${{ env.MODULE_SOURCE == 'q2fork' && 'machachu56/quest-kexec-q2' || 'WitherBlitz/Quest-2-Steam-OS-Dual-Boot' }}" \
          GITHUB_WORKSPACE="${{ github.workspace }}" MODULE_DIR="$MODULE_DIR" \
          RUNNER_TEMP="${{ runner.temp }}" \
            python3 "${{ runner.temp }}/generate_provenance.py"
          cat "${{ runner.temp }}/build-provenance.json"

      - name: Package artifacts
        run: |
          ARTIFACT_DIR="${{ runner.temp }}/artifacts"
          mkdir -p "$ARTIFACT_DIR"
          cp "$MODULE_DIR"/*.ko "$ARTIFACT_DIR/"
          if [[ -s "$KERNEL_OUT/arch/arm64/boot/Image" ]]; then
            cp "$KERNEL_OUT/arch/arm64/boot/Image" "$ARTIFACT_DIR/Image"
          else
            echo "::error::kernel Image missing from the build output"
