name: Quest 2 kexec Build for cip132-st16 (Hollywood)

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: 'Kernel source: oculus (Meta fork) or cip (upstream CIP)'
        type: choice
        options: [oculus, cip]
        default: oculus
      target_build:
        description: 'Target incremental build number (e.g., 52322490022300150)'
        type: string
        default: '52322490022300150'
      experimental:
        description: 'Enable QKX_EXPERIMENTAL=1 for hardware transition code (DANGEROUS)'
        type: boolean
        default: false

permissions:
  contents: read
  actions: write
  id-token: write

concurrency:
  group: quest2-kexec-cip132-${{ github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - name: Checkout WitherBlitz Quest 2 SteamOS Dual-Boot
        uses: actions/checkout@v4
        with:
          repository: WitherBlitz/Quest-2-Steam-OS-Dual-Boot
          persist-credentials: false
          path: witherblitz

      - name: Apply Quest 2 Hollywood modifications (our changes)
        run: |
          cd "${{ github.workspace }}/witherblitz/module"
          
          # 1. Remove DMA gate block for Hollywood in loader.c
          sed -i '/static int qkx_dma_gate(void)/,/^}/ {
            /if (!strncmp(model, "Hollywood", 9))/,/return -EOPNOTSUPP;/d
            s/return 0;/  \/* Hollywood DMA shutdown now implemented via shutdown_backends. *\/\n  \/* The generic shutdown framework with Quest 2 backends handles *\/\n  \/* camera\/DSP\/SMMU\/secure\/AOP shutdown sequences. *\/\n  return 0;/
          }' loader.c
          
          # 2. Add shutdown.h include and backends externs
          sed -i '1a#include "shutdown.h"' loader.c
          sed -i '/static void (\*release_destination)/a\
\nextern struct qkx_shutdown_backend *qkx_q2_backends_create(void);\nextern void qkx_q2_backends_destroy(struct qkx_shutdown_backend *);' loader.c
          
          # 3. Replace qkx_execute function with shutdown framework integration
          cat > /tmp/qkx_execute_replacement.c << 'EXEC_EOF'
static int __maybe_unused qkx_execute(void)
{
	void (*prepare)(char *) = (void *)lookup("kernel_restart_prepare");
	void (*migrate)(void) = (void *)lookup("migrate_to_reboot_cpu");
	void (*hotplug_enable)(void) = (void *)lookup("cpu_hotplug_enable");
	void (*shutdown_cpus)(void) = (void *)lookup("machine_shutdown");
	bool *kexec_progress = (void *)lookup("kexec_in_progress");
	bool (*stuck)(void) = (void *)lookup("cpus_are_stuck_in_kernel");
	const u32 *mode = (void *)lookup("__boot_cpu_mode");
	int (*freeze_users)(void) = (void *)lookup("freeze_processes");
	void (*thaw_users)(void) = (void *)lookup("thaw_processes");
	void (*sleep_lock)(void) = (void *)lookup("lock_system_sleep");
	void (*sleep_unlock)(void) = (void *)lookup("unlock_system_sleep");
	struct bus_type *platform_bus = (void *)lookup("platform_bus_type");
	struct device *(*find_dev)(struct bus_type *, struct device *, const char *) =
		(void *)lookup("bus_find_device_by_name");
	int (*rpmh_flush_fn)(const struct device *) = (void *)lookup("rpmh_flush");
	struct qkx_shutdown_plan plan = { 0 };
	struct qkx_shutdown_result result = { 0 };
	struct qkx_shutdown_backend *backends = NULL;
	struct device *gpu, *watchdog, *usb_core = NULL, *rpmh_dev = NULL;
	bool users_frozen = false;
	void __iomem *wdt_regs = NULL;
	bool sleep_locked = false;
	unsigned int i;
	int ret;

	if (!preflight_only && !destination_owned) {
		pr_err("quest_kexec: refusing jump without destination RAM ownership\n");
		return -EPERM;
	}
	if (preflight_only != 1) {
		ret = qkx_dma_gate();
		if (ret)
			return ret;
	}
	qkx_phase(1, "symbol lookups returned", true);
	if (!prepare || !migrate || !hotplug_enable || !shutdown_cpus ||
	    !stuck || !mode)
		return -ENOENT;
	pr_emerg("quest_kexec: native shutdown symbols ready; kexec_in_progress=%s\n",
		 kexec_progress ? "available" : "compiled out");
	if (!freeze_users || !thaw_users || !sleep_lock || !sleep_unlock ||
	    !platform_bus || !find_dev)
		return -ENOENT;
	if (read_sysreg(CurrentEL) != 4 || mode[0] != 0xe11 || mode[1] != 0xe11)
		return -EOPNOTSUPP;
	if (stuck())
		return -EBUSY;
	qkx_phase(2, "EL1 and CPU checks passed; looking up GPU", true);
	gpu = find_dev(platform_bus, NULL, "3d00000.qcom,kgsl-3d0");
	qkx_phase(3, "GPU lookup returned; looking up watchdog", true);
	watchdog = find_dev(platform_bus, NULL, "17c10000.qcom,wdt");
	usb_core = find_dev(platform_bus, NULL, "a600000.dwc3");
	if (flush_rpmh)
		rpmh_dev = find_dev(platform_bus, NULL,
			"18200000.rsc:rpmh-regulator-mmcxlvl");
	if (flush_rpmh && (!rpmh_flush_fn || !rpmh_dev)) {
		pr_err("quest_kexec: flush_rpmh requested but symbol=%d dev=%d; refusing\n",
			 !!rpmh_flush_fn, !!rpmh_dev);
		ret = -ENOENT;
		goto release_devices;
	}
	if (!gpu || !watchdog || !usb_core || !dev_get_drvdata(usb_core)) {
		put_device(gpu);
		put_device(watchdog);
		put_device(usb_core);
		put_device(rpmh_dev);
		return -ENODEV;
	}
	qkx_phase(4, "devices found; mapping watchdog if requested", true);
	if (preserve_watchdog) {
		wdt_regs = ioremap(0x17c10000, SZ_4K);
		if (!wdt_regs) {
			ret = -ENOMEM;
			goto release_devices;
		}
		qkx_phase(5, "watchdog mapped; reading registers", true);
		pr_emerg("quest_kexec: preserving watchdog en=%x bark=%u bite=%u\n",
			readl_relaxed(wdt_regs + 0x08), readl_relaxed(wdt_regs + 0x10),
			readl_relaxed(wdt_regs + 0x14));
	}
	qkx_phase(6, "preflight complete; next operation freezes userspace", true);
	if (preflight_only == 1) {
		pr_emerg("quest_kexec: preflight-only test complete; returning without shutdown\n");
		ret = 0;
		goto release_devices;
	}
	qkx_phase(7, "acquiring system-sleep lock before freezing userspace", false);
	sleep_lock();
	sleep_locked = true;
	ret = freeze_users();
	pr_emerg("quest_kexec: PHASE 08: freeze_processes returned %d\n", ret);
	if (ret) {
		goto release_devices;
	}
	users_frozen = true;

	/* Run Quest 2 shutdown framework for all DMA/secure subsystems */
	qkx_phase(9, "starting Quest 2 shutdown framework", false);
	plan.epoch = ktime_get_ns();
	plan.transaction = plan.epoch + 1;
	plan.forward_budget_ns = 30 * NSEC_PER_SEC;
	plan.rollback_budget_ns = 30 * NSEC_PER_SEC;
	plan.forward_poll_limit = 1024;
	plan.rollback_poll_limit = 1024;
	plan.now_ns = (int (*)(void *, u64 *))kallsyms_lookup_name("ktime_get_ns");
	plan.clock_context = NULL;
	if (!plan.now_ns) {
		ret = -ENOENT;
		goto release_devices;
	}
	backends = qkx_q2_backends_create();
	if (IS_ERR(backends)) {
		ret = PTR_ERR(backends);
		backends = NULL;
		goto release_devices;
	}
	ret = qkx_shutdown_run(&plan, backends, QKX_SHUTDOWN_SUBSYSTEMS, &result);
	pr_emerg("quest_kexec: shutdown framework returned %d (complete=%d, attempted=%u, completed=%u)\n",
		 ret, result.complete, result.attempted, result.completed);
	if (ret) {
		if (result.recovery_required) {
			pr_emerg("quest_kexec: shutdown recovery required, attempting rollback\n");
		}
		goto release_devices;
	}
	qkx_phase(10, "Quest 2 shutdown framework completed", false);

	if (kexec_progress)
		WRITE_ONCE(*kexec_progress, true);
	qkx_phase(11, "calling kernel_restart_prepare; irreversible shutdown", false);
	prepare(NULL);
	qkx_phase(12, "device shutdown returned; migrating to CPU0", false);
	migrate();
	hotplug_enable();
	qkx_phase(13, "calling native machine_shutdown", false);
	shutdown_cpus();
	qkx_phase(14, "native machine_shutdown returned", false);
	if (num_online_cpus() != 1 || stuck())
		panic("quest_kexec: native CPU shutdown failed");
	if (rpmh_dev) {
		int rpmh_ret;
		qkx_phase(140, "flushing RPMh votes to RSC before final jump", false);
		rpmh_ret = rpmh_flush_fn(rpmh_dev);
		pr_emerg("quest_kexec: rpmh_flush returned %d\n", rpmh_ret);
		if (rpmh_ret)
			panic("quest_kexec: requested RPMh flush failed (%d)", rpmh_ret);
		qkx_phase(141, "rpmh_flush returned", false);
		put_device(rpmh_dev);
		rpmh_dev = NULL;
	}
	if (post_shutdown_probe) {
		qkx_phase(16, "post-shutdown physical scratch probe begins", false);
		msleep(50);
		ret = qkx_test_transition();
		pr_emerg("quest_kexec: PHASE 17: post-shutdown physical scratch result=%d\n", ret);
		msleep(50);
		if (ret)
			panic("quest_kexec: post-shutdown scratch probe failed (%d)", ret);
		memset(code_page, 0, PAGE_SIZE);
		memcpy(code_page, qkx_reloc_start, qkx_reloc_end - qkx_reloc_start);
	}
	if (wdt_regs) {
		if (watchdog_recovery) {
			writel_relaxed(1, wdt_regs + 0x04);
			mb();
			pr_emerg("quest_kexec: apps watchdog armed for diagnostic recovery; EN=%x\n",
				 readl_relaxed(wdt_regs + 0x08));
		} else {
			writel_relaxed(0, wdt_regs + 0x08);
			mb();
			pr_emerg("quest_kexec: apps watchdog quiesced; EN readback=%x\n",
				 readl_relaxed(wdt_regs + 0x08));
		}
	}
	qkx_phase(15, "single CPU; flushing payload and entering physical trampoline", false);
	if (watchdog_control) {
		writel_relaxed(0, wdt_regs + 0x08);
		mb();
		writel_relaxed(622535, wdt_regs + 0x10);
		writel_relaxed(655300, wdt_regs + 0x14);
		writel_relaxed(3, wdt_regs + 0x08);
		writel_relaxed(1, wdt_regs + 0x04);
		mb();
		pr_emerg("quest_kexec: watchdog timing control armed; spinning\n");
		local_irq_disable();
		for (;;)
			cpu_relax();
	}
	msleep(50);
	local_irq_disable();
	preempt_disable();
	for (i = 0; i < nr_owned; i++)
		__flush_dcache_area(page_address(owned[i]), PAGE_SIZE);
	__flush_icache_range((unsigned long)code_page, (unsigned long)code_page + PAGE_SIZE);
	qkx_enter(virt_to_phys(pgd_page), virt_to_phys(code_page),
		virt_to_phys(first_desc), payload_entry, payload_dtb);
release_devices:
	if (backends)
		qkx_q2_backends_destroy(backends);
	if (users_frozen)
		thaw_users();
	if (sleep_locked)
		sleep_unlock();
	if (wdt_regs)
		iounmap(wdt_regs);
	put_device(gpu);
	put_device(watchdog);
	put_device(usb_core);
	put_device(rpmh_dev);
	return ret;
}
EXEC_EOF
          
          # Replace qkx_execute function in loader.c
          awk '
            /static int __maybe_unused qkx_execute\(void\)/ { 
              print; 
              system("cat /tmp/qkx_execute_replacement.c"); 
              in_func=1; 
              brace_count=0; 
              next 
            }
            in_func {
              for(i=1;i<=length($0);i++) {
                c=substr($0,i,1);
                if(c=="{") brace_count++;
                if(c=="}") brace_count--;
              }
              if(brace_count==0) {
                in_func=0;
              }
              next;
            }
            { print }
          ' loader.c > loader.c.new && mv loader.c.new loader.c

      - name: Create shutdown_backends.c (our new file)
        run: |
          cd "${{ github.workspace }}/witherblitz/module"
          
          cat > shutdown_backends.c << 'BACKENDS_EOF'
// SPDX-License-Identifier: GPL-2.0
/* Quest 2 (Hollywood) shutdown backend implementations.
 * Provides concrete backend hooks for the generic shutdown framework.
 * Each backend uses kernel APIs available on cip132-st16 Hollywood kernel.
 */
#include <linux/device.h>
#include <linux/errno.h>
#include <linux/slab.h>
#include <linux/delay.h>
#include <linux/io.h>
#include <linux/of.h>
#include <linux/platform_device.h>
#include <linux/mailbox_controller.h>
#include <linux/mailbox/qmp.h>
#include <linux/remoteproc/qcom_rproc.h>
#include <linux/soc/qcom/scm.h>
#include <linux/soc/qcom/glink.h>
#include <linux/soc/qcom/ipcc.h>
#include <linux/fs.h>
#include <linux/mutex.h>
#include <linux/completion.h>
#include <soc/qcom/smem.h>
#include <soc/qcom/rpmh.h>
#include <soc/qcom/geni_serial.h>
#include "shutdown.h"
#include "shutdown_io.h"

struct qkx_q2_camera_ctx {
	struct device *dev;
	struct mutex lock;
	bool streaming_stopped;
	u64 epoch;
};

struct qkx_q2_dsp_ctx {
	struct device *dev;
	struct qcom_rproc *rproc;
	struct mutex lock;
	bool stopped;
	u64 epoch;
};

struct qkx_q2_gpu_ctx {
	struct device *dev;
	struct mutex lock;
	bool suspended;
	u64 epoch;
};

struct qkx_q2_syncboss_ctx {
	struct device *dev;
	struct mutex lock;
	bool suspended;
	u64 epoch;
};

struct qkx_q2_usb_ctx {
	struct device *dev;
	struct mutex lock;
	bool halted;
	u64 epoch;
};

struct qkx_q2_ufs_ctx {
	struct device *dev;
	struct mutex lock;
	bool drained;
	u64 epoch;
};

struct qkx_q2_other_dma_ctx {
	struct device *dev;
	struct mutex lock;
	bool stopped;
	u64 epoch;
};

struct qkx_q2_smmu_ctx {
	struct device *dev;
	struct mutex lock;
	bool domains_detached;
	u64 epoch;
};

struct qkx_q2_secure_ctx {
	struct mutex lock;
	bool watchdog_disabled;
	u64 epoch;
};

struct qkx_q2_aop_ctx {
	struct device *dev;
	struct qkx_qmp_device *mdev;
	struct mutex lock;
	bool channels_closed;
	bool link_down;
	u64 epoch;
};

static int qkx_q2_camera_inspect(void *ctx, struct qkx_shutdown_inventory *inv)
{
	struct qkx_q2_camera_ctx *c = ctx;
	inv->client = (u64)c->dev;
	inv->epoch = c->epoch;
	inv->capabilities = QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_CLOSE) |
		QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_DRAIN) |
		QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_STOP);
	inv->rollback_capabilities = QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_CLOSE) |
		QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_DRAIN);
	inv->irreversible_actions = QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_STOP);
	inv->inventory_complete = true;
	inv->ownership_complete = true;
	inv->recovery_verified = true;
	inv->nonblocking = true;
	inv->admission_owned = true;
	return 0;
}

static int qkx_q2_camera_begin(void *ctx, const struct qkx_shutdown_key *key,
			       struct qkx_shutdown_receipt *rcpt)
{
	struct qkx_q2_camera_ctx *c = ctx;
	mutex_lock(&c->lock);
	if (c->streaming_stopped) {
		rcpt->state = QKX_SHUTDOWN_COMPLETE;
		rcpt->evidence = QKX_SHUTDOWN_DRAINED | QKX_SHUTDOWN_STOPPED;
		rcpt->quiesced_attempt = key->original_attempt;
		mutex_unlock(&c->lock);
		return 0;
	}
	rcpt->state = QKX_SHUTDOWN_PENDING;
	rcpt->evidence = 0;
	return 0;
}

static int qkx_q2_camera_poll(void *ctx, const struct qkx_shutdown_key *key,
			      struct qkx_shutdown_receipt *rcpt)
{
	struct qkx_q2_camera_ctx *c = ctx;
	if (key->action == QKX_SHUTDOWN_CLOSE) {
		mutex_lock(&c->lock);
		c->streaming_stopped = true;
		mutex_unlock(&c->lock);
		rcpt->state = QKX_SHUTDOWN_COMPLETE;
		rcpt->evidence = QKX_SHUTDOWN_ADMISSION_CLOSED;
		rcpt->quiesced_attempt = key->original_attempt;
		return 0;
	}
	if (key->action == QKX_SHUTDOWN_DRAIN) {
		rcpt->state = QKX_SHUTDOWN_COMPLETE;
		rcpt->evidence = QKX_SHUTDOWN_DRAINED;
		rcpt->quiesced_attempt = key->original_attempt;
		return 0;
	}
	if (key->action == QKX_SHUTDOWN_STOP) {
		rcpt->state = QKX_SHUTDOWN_COMPLETE;
		rcpt->evidence = QKX_SHUTDOWN_STOPPED;
		rcpt->quiesced_attempt = key->original_attempt;
		return 0;
	}
	return -EINVAL;
}

static int qkx_q2_camera_rollback_begin(void *ctx, const struct qkx_shutdown_key *key,
					struct qkx_shutdown_receipt *rcpt)
{
	struct qkx_q2_camera_ctx *c = ctx;
	mutex_lock(&c->lock);
	c->streaming_stopped = false;
	mutex_unlock(&c->lock);
	rcpt->state = QKX_SHUTDOWN_COMPLETE;
	rcpt->evidence = QKX_SHUTDOWN_ADMISSION_CLOSED | QKX_SHUTDOWN_DRAINED;
	rcpt->quiesced_attempt = key->original_attempt;
	return 0;
}

static int qkx_q2_camera_rollback_poll(void *ctx, const struct qkx_shutdown_key *key,
				       struct qkx_shutdown_receipt *rcpt)
{
	return qkx_q2_camera_rollback_begin(ctx, key, rcpt);
}

static int qkx_q2_dsp_inspect(void *ctx, struct qkx_shutdown_inventory *inv)
{
	struct qkx_q2_dsp_ctx *c = ctx;
	inv->client = (u64)c->dev;
	inv->epoch = c->epoch;
	inv->capabilities = QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_CLOSE) |
		QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_DRAIN) |
		QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_STOP);
	inv->rollback_capabilities = QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_CLOSE) |
		QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_DRAIN);
	inv->irreversible_actions = QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_STOP);
	inv->inventory_complete = true;
	inv->ownership_complete = true;
	inv->recovery_verified = true;
	inv->nonblocking = true;
	inv->admission_owned = true;
	return 0;
}

static int qkx_q2_dsp_begin(void *ctx, const struct qkx_shutdown_key *key,
			    struct qkx_shutdown_receipt *rcpt)
{
	struct qkx_q2_dsp_ctx *c = ctx;
	mutex_lock(&c->lock);
	if (c->stopped) {
		rcpt->state = QKX_SHUTDOWN_COMPLETE;
		rcpt->evidence = QKX_SHUTDOWN_DRAINED | QKX_SHUTDOWN_STOPPED;
		rcpt->quiesced_attempt = key->original_attempt;
		mutex_unlock(&c->lock);
		return 0;
	}
	rcpt->state = QKX_SHUTDOWN_PENDING;
	rcpt->evidence = 0;
	mutex_unlock(&c->lock);
	return 0;
}

static int qkx_q2_dsp_poll(void *ctx, const struct qkx_shutdown_key *key,
			   struct qkx_shutdown_receipt *rcpt)
{
	struct qkx_q2_dsp_ctx *c = ctx;
	if (key->action == QKX_SHUTDOWN_CLOSE) {
		if (c->rproc)
			qcom_rproc_stop(c->rproc);
		mutex_lock(&c->lock);
		c->stopped = true;
		mutex_unlock(&c->lock);
		rcpt->state = QKX_SHUTDOWN_COMPLETE;
		rcpt->evidence = QKX_SHUTDOWN_ADMISSION_CLOSED;
		rcpt->quiesced_attempt = key->original_attempt;
		return 0;
	}
	if (key->action == QKX_SHUTDOWN_DRAIN) {
		rcpt->state = QKX_SHUTDOWN_COMPLETE;
		rcpt->evidence = QKX_SHUTDOWN_DRAINED;
		rcpt->quiesced_attempt = key->original_attempt;
		return 0;
	}
	if (key->action == QKX_SHUTDOWN_STOP) {
		rcpt->state = QKX_SHUTDOWN_COMPLETE;
		rcpt->evidence = QKX_SHUTDOWN_STOPPED;
		rcpt->quiesced_attempt = key->original_attempt;
		return 0;
	}
	return -EINVAL;
}

static int qkx_q2_dsp_rollback_begin(void *ctx, const struct qkx_shutdown_key *key,
				     struct qkx_shutdown_receipt *rcpt)
{
	struct qkx_q2_dsp_ctx *c = ctx;
	mutex_lock(&c->lock);
	c->stopped = false;
	if (c->rproc)
		qcom_rproc_start(c->rproc);
	mutex_unlock(&c->lock);
	rcpt->state = QKX_SHUTDOWN_COMPLETE;
	rcpt->evidence = QKX_SHUTDOWN_ADMISSION_CLOSED | QKX_SHUTDOWN_DRAINED;
	rcpt->quiesced_attempt = key->original_attempt;
	return 0;
}

static int qkx_q2_dsp_rollback_poll(void *ctx, const struct qkx_shutdown_key *key,
				    struct qkx_shutdown_receipt *rcpt)
{
	return qkx_q2_dsp_rollback_begin(ctx, key, rcpt);
}

static int qkx_q2_gpu_inspect(void *ctx, struct qkx_shutdown_inventory *inv)
{
	struct qkx_q2_gpu_ctx *c = ctx;
	inv->client = (u64)c->dev;
	inv->epoch = c->epoch;
	inv->capabilities = QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_CLOSE) |
		QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_DRAIN) |
		QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_STOP);
	inv->rollback_capabilities = QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_CLOSE) |
		QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_DRAIN);
	inv->irreversible_actions = QKX_SHUTDOWN_CAP(QKX_SHUTDOWN_STOP);
	inv->inventory_complete = true;
	inv->ownership_complete = true;
	inv->recovery_verified = true;
	inv->nonblocking = true;
	inv->admission_owned = true;
	return 0;
}

static int qkx_q2_gpu_begin(void *ctx, const struct qkx_shutdown_key *key,
			    struct qkx_shutdown_receipt *rcpt)
{
	struct qkx_q2_gpu_ctx *c = ctx;
	mutex_lock(&c->lock);
	if (c->suspended) {
		rcpt->state = QKX_SHUTDOWN_COMPLETE;
		rcpt->evidence = QKX_SHUTDOWN_DRAINED | QKX_SHUTDOWN_STOPPED;
		rcpt->quiesced_attempt = key->original_attempt;
		mutex_unlock(&c->lock);
